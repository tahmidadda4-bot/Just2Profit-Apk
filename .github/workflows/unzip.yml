name: Extract Just2Profit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e

          rm -rf android admin backend database
          rm -rf .github/workflows/build-apk.yml

          unzip -o Just2Profit-FULL-READY.zip

          echo "Checking project folders..."
          ls -la
          ls -la android
          ls -la admin
          ls -la backend
          ls -la database

      - name: Commit Project
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add android admin backend database README-BN.md

          git commit -m "Add complete Just2Profit project" || echo "Nothing to commit"

          git push
